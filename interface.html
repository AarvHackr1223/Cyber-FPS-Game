<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyberbots in City Mod - Main Menu</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Impact', 'Arial Black', sans-serif;
            user-select: none;
        }

        body {
            width: 100vw;
            height: 100vh;
            background: #050002;
            color: #fff;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Glitchy dark red background overlay */
        body::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, rgba(120, 0, 20, 0.4) 0%, rgba(0,0,0,0.95) 80%);
            z-index: 1;
        }

        .header-title {
            position: relative;
            z-index: 2;
            margin-top: 40px;
            text-align: center;
        }

        h1 {
            font-size: 56px;
            color: #ff0033;
            text-shadow: 4px 4px 0px #000, -2px -2px 0px #fff;
            letter-spacing: 3px;
            text-transform: uppercase;
            animation: pulse 1.5s infinite alternate;
        }

        .subtitle {
            font-size: 20px;
            color: #ffcc00;
            text-shadow: 2px 2px 0px #000;
            letter-spacing: 4px;
            margin-top: -5px;
        }

        /* Center Menu Container */
        .menu-box {
            position: relative;
            z-index: 2;
            width: 380px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .menu-btn {
            width: 100%;
            padding: 16px;
            font-size: 22px;
            font-family: 'Impact', sans-serif;
            letter-spacing: 2px;
            color: #fff;
            background: #111;
            border: 3px solid #ff0033;
            box-shadow: 5px 5px 0px #000;
            cursor: pointer;
            transition: all 0.1s ease;
            text-transform: uppercase;
        }

        .menu-btn:hover {
            background: #ff0033;
            color: #000;
            transform: translate(-2px, -2px);
            box-shadow: 7px 7px 0px #fff;
        }

        .menu-btn:active {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0px #000;
        }

        /* Cyberbots City Info Card */
        .info-card {
            position: relative;
            z-index: 2;
            background: rgba(0, 0, 0, 0.85);
            border: 2px solid #444;
            padding: 15px 25px;
            border-radius: 4px;
            margin-bottom: 30px;
            font-family: monospace;
            font-size: 13px;
            color: #aaa;
            text-align: center;
        }

        .info-card span {
            color: #ffcc00;
            font-weight: bold;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            100% { transform: scale(1.03); }
        }
    </style>
</head>
<body>

    <div class="header-title">
        <h1>CYBERBOTS</h1>
        <div class="subtitle">IN CITY MOD</div>
    </div>

    <div class="menu-box">
        <button class="menu-btn" onclick="startGame()">PLAY GAME</button>
        <button class="menu-btn" style="border-color: #ffaa00;" onclick="alert('Controls: WASD/Arrows to Move | Space to Bhop | Mouse to Aim')">CONTROLS</button>
        <button class="menu-btn" style="border-color: #555; color: #777;" onclick="window.close()">EXIT</button>
    </div>

    <div class="info-card">
        [CITY STATUS]: <span>2 HUMANOID CYBERBOTS SPOTTED</span><br>
        EQUIPMENT: <span>FIRST-PERSON BLASTER LOADED</span>
    </div>

    <script>
        function startGame() {
            // Launches the main game file using your capitalized naming rule
            window.location.href = 'Game.html';
        }
    </script>

</body>
</html>
